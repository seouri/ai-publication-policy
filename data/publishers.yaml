# Tier 2 publishers, each with its Tier 3 journals and optional Tier 4 article_rules.
# File order is the top-to-bottom order in the cascade. See README for fields.

publishers:
- id: sn
  name: Springer Nature
  strictness: 3
  date: launched 10 Sept 2026
  url: https://www.springernature.com/gp/policies/editorial-policies/ai-manuscript-preparation
  verdict: A green/amber/red risk framework that applies to authors, reviewers and editors alike.
  rules:
  - 'Green (language polish, translation): allowed, still "describe use"'
  - 'Amber (extensive writing support): allowed with oversight and disclosure'
  - 'Red: fabrication, AI as author, delegating peer review, deepfake images'
  - The old copy-editing exemption is gone
  - Images allowed only if traceable to verifiable source data
  - '"Declaration does not negatively influence editorial decisions"'
  journals:
  - id: nature
    name: Nature
    strictness: 3
    vs_parent: inconsistent
    tier: Journal · flagship
    url: https://www.nature.com/nature/editorial-policies/ai
    verdict: Nature's own AI policy page carries the portfolio risk framework, while its submission guide still uses the older Methods-documentation wording.
    rules:
    - 'Editorial policy page: green/amber/red risk framework; authors "disclose AI use for trust and transparency"'
    - 'Initial-submission guide: "Use of an LLM should be properly documented in the Methods section"'
    - 'Red tier: fabricated data or citations, AI authorship, delegating peer review, photorealistic images'
    - 'Reviewers: no manuscript content in "unsecured or public AI systems"; disclose any AI use in the report'
    - Editors use AI only to "summarise, retrieve or highlight information"
    - 'Practical advice: describe use in Methods and add an AI declaration'
  - id: nm
    name: Nature Medicine
    strictness: 3
    vs_parent: same
    url: https://www.nature.com/nm/editorial-policies/artificial-intelligence
    verdict: 'Fully migrated: its AI policy page carries the risk framework, and its submission guidelines no longer contain the legacy LLM text.'
    rules:
    - Green / amber / red tiers, as for Springer Nature
  - id: nmi
    name: Nature Machine Intelligence
    strictness: 3
    vs_parent: inconsistent
    url: https://www.nature.com/natmachintell/submission-guidelines/preparing-your-submission
    verdict: 'Same mismatch as Nature Medicine: legacy guideline text alongside the new framework.'
    rules:
    - LLM use documented in Methods (legacy text)
    - Risk framework applies at the portfolio level
    - 'Practical advice: satisfy both'
    note: ⚠ Legacy wording checked before Oct 2026. Nature Medicine has since removed it, so these journals may have too.
  - id: nmb
    name: Nat. Methods · Biotech · BME
    strictness: 3
    vs_parent: inconsistent
    tier: Journals
    url: https://www.nature.com/nature-portfolio/editorial-policies/ai
    verdict: All three carry the same legacy guideline wording as Nature Medicine.
    rules:
    - Methods documentation of LLM use (legacy)
    - Generative AI cover art not permitted (legacy)
    - Portfolio risk framework applies on top
    note: ⚠ Legacy wording checked before Oct 2026. Nature Medicine has since removed it, so these journals may have too.
  - id: npj
    name: npj Digital Medicine
    strictness: 3
    vs_parent: same
    url: https://www.nature.com/npjdigitalmed/editorial-policies/artificial-intelligence
    verdict: 'Fully migrated: its AI page repeats the portfolio risk framework word for word.'
    rules:
    - Green / amber / red tiers, as for Springer Nature
    - AI declaration; image use also noted in the caption
  - id: gb
    name: Genome Biology (BMC)
    strictness: 3
    vs_parent: same
    url: https://link.springer.com/brands/bmc/editorial-policies
    verdict: All BMC journals, including Genome Biology, moved to the Springer Nature risk framework in Aug 2026.
    rules:
    - The old Methods-documentation rule, copy-editing exemption and AI-image ban were removed
    - Green-tier use is permitted; image rules follow the Springer Nature manuscript-preparation page
    - Flags "non-existent/hallucinated references generated by an AI tool" as unreliable citations
    - 'Reviewers: no confidential content in unsecured or public AI tools; declare any AI help in the report'
    note: Confirmed on the live page, browser-saved 23 Oct 2026.
  note: The framework appeared on Springer Nature sites in Aug 2026 and was announced in a press release on 10 Sept 2026.
- id: els
  name: Elsevier
  strictness: 3
  date: June 2026
  url: https://www.elsevier.com/about/policies-and-standards/generative-ai-policies-for-journals
  verdict: A dedicated, published AI declaration with a clean grammar exemption and the most precise image rules.
  rules:
  - Separate declaration right before the references, using the template "…used [TOOL] in order to [REASON]…"
  - 'Exempt: basic grammar/spelling, reference managers, accessibility tools; translation is not exempt'
  - 'Images: schematics OK with caption; data visualizations only if reproducible; primary research images never'
  - No AI graphical abstracts; fabricated references can lead to rejection
  - 'Reviewers: no uploads; only private tools for support tasks'
  journals:
  - id: ldh
    name: Lancet Digital Health
    strictness: 4
    vs_parent: stricter
    date: Aug 2026
    url: https://www.thelancet.com/pb-assets/Lancet/authors/tldh-info-for-authors-1723037803860.pdf
    verdict: Elsevier's declaration, plus prompts on request and a stricter figure rule of its own.
    rules:
    - 'Declaration: tool, version, purpose, oversight; editors may request prompts'
    - Basic grammar, spelling and punctuation need no declaration
    - 'Figures: AI "primarily as a tool for brainstorming"'
    - No images of copyrighted material, real people or brands
    - Do not grant AI tools training rights over your manuscript
    - Reviewers should not use AI "to assist in the scientific review" or upload their own comments, even to improve language
    note: Reviewer rule confirmed on the live page, browser-saved 23 Oct 2026. It is stricter than Elsevier's June 2026 reviewer policy.
    cites:
    - icmje
    article_rules:
    - id: lanop
      name: World Report · Comment
      sub: Lancet family
      strictness: 5
      url: https://www.thelancet.com/pb-assets/Lancet/authors/tldh-info-for-authors-1723037803860.pdf
      verdict: Generative AI is banned in some sections and limited to grammar in others.
      rules:
      - 'World Report and Perspectives: generative AI banned'
      - 'Comment and Correspondence: grammar and spelling only, with no translation, argument improvement, shortening or reference work'
  - id: cell
    name: Cell Rep Med · Patterns · Cell Sys
    strictness: 3
    vs_parent: stricter
    tier: Journals
    url: https://www.cell.com/cell-reports-medicine/information-for-authors/journal-policies
    verdict: Follows the Elsevier policy but asks for research AI use in both STAR Methods and the AI statement, and bans AI cover art.
    rules:
    - Authors may use generative AI, "including agents and deep research tools", for literature synthesis, ideas, organization and language, with human oversight
    - Declaration goes in a new section after the Declaration of Interests and is published
    - 'Research use: described reproducibly in Methods or STAR Methods and in the AI statement, with tool, version and developer'
    - Explanatory images allowed, declared in the legend and AI statement; data visualizations only if derived directly from data
    - No AI creation or alteration of research images, including brightness or contrast changes
    - No AI cover art (exception only when AI is integral to the research); no general-purpose AI images in graphical abstracts
    - Reviewers follow the Elsevier peer-review AI policy
    note: Confirmed on the live page, browser-saved 23 Oct 2026. The Cell Reports Medicine, Patterns and Cell Systems pages are identical.
  - id: jbi
    name: J Biomed Informatics
    strictness: 3
    vs_parent: same
    url: https://www.elsevier.com/about/policies-and-standards/generative-ai-policies-for-journals
    verdict: Standard Elsevier policy with no journal-specific additions.
    rules:
    - See Elsevier
  - id: ijmi
    name: Int J Med Informatics
    strictness: 3
    vs_parent: same
    url: https://www.elsevier.com/about/policies-and-standards/generative-ai-policies-for-journals
    verdict: Standard Elsevier policy with no journal-specific additions.
    rules:
    - See Elsevier
- id: oup
  name: Oxford UP
  strictness: 2
  date: wording since early 2024
  url: https://academic.oup.com/pages/for-authors/journals/preparing-and-submitting-your-manuscript/ethics
  verdict: A thin baseline. Societies such as ISCB add the real constraints on top.
  rules:
  - AI is not an author, and OUP screens author lists for it
  - AI used "to help generate content or images, write code, process data, or for translation" must be disclosed
  - Disclose in the cover letter and in Methods or Acknowledgements
  - No OUP-wide reviewer or AI-image rule for journals
  cites:
  - cope
  journals:
  - id: jamia
    name: JAMIA · JAMIA Open
    strictness: 2
    vs_parent: same
    tier: Journals
    url: https://academic.oup.com/jamia/pages/General_Instructions
    verdict: The field's flagship carries only OUP's standard wording, with no AMIA additions found.
    rules:
    - AI is not an author; "the Journal" screens author lists
    - AI use "should be disclosed" in the cover letter and in Methods or Acknowledgements (softer than OUP's "must")
    - Links the COPE position statement; no image or reviewer clause
    note: Confirmed on the live page, browser-saved 23 Oct 2026. Wording unchanged since May 2024; no AMIA-specific AI policy.
  - id: bioinf
    name: Bioinformatics
    strictness: 5
    vs_parent: stricter
    tier: Journal · ISCB official
    url: https://academic.oup.com/bioinformatics/pages/author-guidelines
    verdict: The strictest journal surveyed. ISCB policy overrides the permissive OUP baseline.
    rules:
    - 'Carries an older journal version of the ISCB text: "not acceptable to use LLMs… to draft papers… papers must be written by researchers"'
    - Declare use in the supplementary materials, plus OUP's cover-letter and Methods rule
    - Reviewers may not submit manuscripts to an LLM or rely on one to generate the review
    cites:
    - iscb
  - id: bib
    name: Briefings in Bioinformatics
    strictness: 5
    vs_parent: stricter
    url: https://academic.oup.com/bib/pages/General_Instructions
    verdict: Carries the same ISCB-derived wording as Bioinformatics, though it is not an ISCB journal.
    rules:
    - 'Follows the ISCB policy: "It is not acceptable to use LLMs… to draft papers… papers must be written by researchers"'
    - Declare acceptable use "with sufficient details in the supplementary materials"; label any LLM text snippets
    - The page carries both the older and current OUP disclosure wording
    - No reviewer clause
    cites:
    - iscb
    note: Confirmed on the live page, browser-saved 23 Oct 2026.
  - id: nar
    name: Nucleic Acids Research
    strictness: 2
    vs_parent: same
    url: https://academic.oup.com/nar/pages/author-guidelines
    verdict: Standard OUP wording, with no AI image ban.
    rules:
    - Author guidelines carry the current OUP wording; the policies page still has the older "generate content, write code, or analyze data" text
    - 'Only image rule found: "inappropriate image manipulation" counts as misconduct'
- id: jmirp
  name: JMIR Publications
  strictness: 3
  date: updated 23 Oct 2026
  url: https://support.jmir.org/hc/en-us/articles/13387268671771
  verdict: Disclosure now goes through a dedicated submission question and is published as a separate AI statement. Full transcripts are requested, not required.
  rules:
  - Answer the dedicated generative-AI disclosure question at submission and resubmission
  - Published as a dedicated AI disclosure statement; "Generative AI use should not be disclosed in the Acknowledgments section"
  - Authors are asked to keep prompts and transcripts and to submit them as a Multimedia Appendix; editors may ask for them
  - No grammar exemption
  - AI table-of-contents images are encouraged (prompt in caption, CC0)
  - Reviewers may use AI with a set disclosure format; consumer-tier free ChatGPT not allowed
  cites:
  - stm
  journals:
  - id: jmir
    name: JMIR · Med Inform · JMIR AI
    strictness: 3
    vs_parent: same
    tier: Journals
    url: https://ai.jmir.org/author-information/publication-ethics-and-malpractice
    verdict: All three titles link to the same publisher policy.
    rules:
    - See JMIR Publications (dedicated AI statement since 23 Oct 2026)
  note: Changed 23 Oct 2026; earlier versions put disclosure in Methods or Acknowledgments. The version tag still reads "V2023-August 31, 2023".
- id: thieme
  name: Thieme
  strictness: 4
  date: AI section rewritten mid-2026
  url: https://www.thieme.com/en-us/journal-policies
  verdict: A declaration is mandatory even when you used no AI, and it has the strictest image rule.
  rules:
  - A separate "Declaration of Generative AI Use" statement is mandatory and published with the article
  - 'If none: "The authors confirm that no Generative AI was used…"'
  - The GAIDeT declaration generator is recommended
  - Generative AI images, video and illustrations are banned unless the editor approves and a form is signed
  - Non-generative ML image enhancement is allowed if disclosed in the caption
  - No reviewer AI rule on the publisher page
  cites:
  - cope
  journals:
  - id: thj
    name: ACI · Methods Inf Med · Yearbook
    strictness: 4
    vs_parent: same
    tier: Journals
    url: https://www.thieme.com/en-us/journal-policies
    verdict: The Thieme publisher policy applies. The Yearbook also points to ICMJE.
    rules:
    - Mandatory published AI declaration, including a statement when no AI was used
    - Generative AI images banned without a signed exception
    - Journal author instructions (ACI 2026, MIM 2025) do not mention AI; the IMIA Yearbook requires ICMJE
    note: No journal-level reviewer AI rule; ICMJE's applies to the Yearbook by reference.
    cites:
    - icmje
- id: plos
  name: PLOS
  strictness: 3
  date: rewritten Sept 2026
  url: https://journals.plos.org/ploscompbiol/s/ethical-publishing-practice
  verdict: Permissive on use, firm on review. AI cannot act as a reviewer or decision-maker.
  rules:
  - Disclose tool names, how each was used, which parts were affected, and "how the user evaluated the validity of the tool's outputs"
  - Disclose in a dedicated Methods section, Acknowledgements, or the figure legend
  - 'Exempt: language editing and cover letters; translation disclosure recommended but optional'
  - AI figures allowed for illustration or summaries, disclosed in the legend
  - Reviewers and editors may not use AI to summarize or evaluate submissions; light copyediting of own comments only, disclosed
  - Disclosure "is not a basis for negative editorial decisions"
  journals:
  - id: pcb
    name: PLOS Comp Biol
    strictness: 3
    vs_parent: same
    url: https://journals.plos.org/ploscompbiol/s/ethical-publishing-practice
    verdict: Standard PLOS policy.
    rules:
    - See PLOS
- id: cshl
  name: CSHL Press
  strictness: 3
  date: page file modified Aug 2026
  url: https://cshjournals.org/editorial_policies
  verdict: Methods-only disclosure, and AI graphics are strongly discouraged.
  rules:
  - Adopts the ICMJE guidance on AI use
  - Document tool, version and a complete description in Methods
  - 'Exempt: language refinement, grammar checkers, reference managers'
  - AI-generated or AI-edited graphics are "strongly discouraged" and must be declared
  - Reviewers may not upload any part of a manuscript to AI tools; they may polish their own language and must declare AI help
  - Tool terms must not restrict publishing its output
  cites:
  - icmje
  journals:
  - id: gr
    name: Genome Research
    strictness: 3
    vs_parent: same
    url: https://genome.cshlp.org/ifora_Artificial
    verdict: Standard CSHL policy.
    rules:
    - No need to acknowledge AI grammar/spelling checkers or reference managers
    note: Confirmed on the live page, browser-saved 23 Oct 2026.
- id: jaman
  name: JAMA Network
  strictness: 4
  date: Sept 2026
  url: https://jamanetwork.com/journals/jama/pages/instructions-for-authors
  verdict: The most granular disclosure in clinical publishing, plus bans by article type.
  rules:
  - 'Acknowledgment: name, version, manufacturer, dates of use, sections affected'
  - 'Research use: prompts with their sequence and revisions, in Methods'
  - Basic grammar and spelling checking is exempt
  - AI-created clinical images, video and audio are banned (unless part of the method)
  - Do not use AI to generate or format references
  - 'Reviewers: no confidential manuscripts in chatbots'
  cites:
  - icmje
  journals:
  - id: jama
    name: JAMA · JAMA Netw Open
    strictness: 4
    vs_parent: same
    tier: Journals
    date: Sept 2026
    url: https://jamanetwork.com/journals/jamanetworkopen/pages/instructions-for-authors
    verdict: Network policy applies to both titles.
    rules:
    - See JAMA Network
    - Article-type bans apply (next layer)
    article_rules:
    - id: jamaop
      name: Opinion & letters
      sub: JAMA
      strictness: 5
      url: https://jamanetwork.com/journals/jama/pages/instructions-for-authors
      verdict: No AI drafting in JAMA's voice-driven formats.
      rules:
      - Viewpoints, Piece of My Mind, Poetry, Letters and Online Comments may not be drafted with AI
- id: nejmg
  name: NEJM Group
  strictness: 3
  date: July 2026
  url: https://www.nejm.org/about-nejm/editorial-policies
  verdict: Adopts ICMJE almost verbatim, and discloses its own editorial use of AI.
  rules:
  - 'Disclose in the cover letter and the manuscript: technologies used and what they produced'
  - Review and edit all AI material; never cite AI as a primary source
  - NEJM uses AI "selectively"; humans make every editorial decision
  note: Confirmed on the live page, browser-saved 23 Oct 2026. It has no AI-image or reviewer AI rule.
  cites:
  - icmje
  journals:
  - id: nejm
    name: NEJM
    strictness: 3
    vs_parent: same
    url: https://www.nejm.org/about-nejm/editorial-policies
    verdict: The group policy applies unchanged.
    rules:
    - See NEJM Group
  - id: nejmai
    name: NEJM AI
    strictness: 2
    vs_parent: looser
    url: https://ai.nejm.org/about/editorial-policies
    verdict: Formally ICMJE, but the founding editorial actively encourages LLM use.
    rules:
    - 'Koller et al. (Jan 2024 issue): "we support and encourage the use of LLMs"'
    - The editorial says Acknowledgments while the policy says cover letter plus manuscript, so do both
    - 'Human+AI Fast Track (Nov 2025): invited, high-likelihood papers only, and only with author permission'
    - A human editor reviews first; GPT-5 Thinking and Gemini 2.5 Pro reviews are advisory
    - Prompts, human and AI reviews, and responses are published in the supplementary appendix
    - 'Reviewers: uploading "may" be prohibited where confidentiality can''t be assured; disclose "if and how" AI is used'
    date: editorials Jan 2024 & Nov 2025
    note: Policy page confirmed on the live page, browser-saved 23 Oct 2026.
- id: bmjg
  name: BMJ Group
  strictness: 3
  date: Sept 2023 · unchanged through Oct 2026
  url: https://authors.bmj.com/policies/ai-use/
  verdict: Disclosure goes in the contributor statement and reaches back to underlying work.
  rules:
  - State what, why and how in the contributor section, plus Methods for research use
  - Consider giving editors the inputs and outputs as supplements
  - Also disclose AI in underlying prior work and key cited sources
  - No grammar exemption; may screen with detectors before and after publication
  - 'Reviewers: declare any AI use; no public tools'
  cites:
  - icmje
  journals:
  - id: bmj
    name: The BMJ
    strictness: 3
    vs_parent: same
    url: https://authors.bmj.com/policies/ai-use/
    verdict: The group policy applies unchanged.
    rules:
    - See BMJ Group
  note: The policy text is identical in every archived copy since Sept 2023, despite the stated six-monthly review.
- id: aaas
  name: AAAS (Science journals)
  strictness: 4
  date: use table Dec 2025
  url: https://www.science.org/cms/asset/34d20d04-f8a3-4983-b6de-6551185ea579/science_journals_guidelines_for_ai_use.pdf
  verdict: A use-by-use table (Dec 2025) says what needs declaring. It dropped the earlier full-prompt requirement. Illustrative AI figures are banned, and nothing from the manuscript may go into an AI tool during review or revision.
  rules:
  - AI tools "do not meet the Science journals' criteria for authorship", and cited sources may not be AI-authored either
  - Note AI use in the cover letter, plus Methods or Acknowledgments depending on the use
  - 'Research use (code, data generation or analysis): describe in Methods with model name and version'
  - 'Drafting, translation, or editing data visualizations: declare in Acknowledgments with model name and version'
  - 'No declaration needed: language refinement, literature searches, formatting data or code, gathering references'
  - AI images, diagrams or figures for illustration are not allowed; exceptions must be discussed with the editor
  - Authors may not enter the manuscript into an AI tool when revising, or enter reviews into one to draft a response
  - Reviewers may not put any part of the manuscript into an AI tool; they may polish their own language with non-training tools if declared
  journals:
  - id: science
    name: Science
    strictness: 4
    vs_parent: same
    tier: Journal · flagship
    url: https://www.science.org/content/page/science-journals-editorial-policies
    verdict: One policy covers every Science family journal, and the flagship adds nothing to it.
    rules:
    - See AAAS (Science journals)
  note: The full-prompt and cover-letter-plus-Acknowledgments wording was replaced between Sept 2025 and Mar 2026. The guidelines PDF is dated 23 Dec 2025 (file metadata). The live policy page (browser-saved 23 Oct 2026) matches the June 2026 archive.
