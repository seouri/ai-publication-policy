# Strictness matrix. Each cell is [score, text]; score 1 (permissive) to 4 (most restrictive), or null if not addressed/unverified.

columns:
- {key: disc, label: Disclosure depth, hint: what you must report}
- {key: gram, label: Grammar edits, hint: 'exempt from disclosure?'}
- {key: draft, label: AI drafting text, hint: how far allowed}
- {key: img, label: AI images, hint: figures & art}
- {key: rev, label: Reviewer AI use, hint: peer-review side}
groups:
- group: Frameworks
  rows:
  - name: ICMJE
    sub: Jan 2026
    disc: [3, Tool + version + prompts (research)]
    gram: [2, '"Acceptable", not clearly exempt']
    draft: [2, 'Allowed, disclosed']
    img: [null, 'Within scope, no rule']
    rev: [3, Permission before upload]
  - name: COPE
    sub: Feb 2023 · current
